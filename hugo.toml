# Configuración del sitio con el tema CleanWhite.
# Cambia baseURL por tu usuario de GitHub (el workflow lo sobreescribe al publicar).
baseURL = 'https://DDJPGARCIA.github.io/'
title = 'Daniel Pérez García | Portafolio'
theme = 'hugo-theme-cleanwhite'
locale = 'es-mx'
defaultContentLanguage = 'es'
enableRobotsTXT = true

[pagination]
  pagerSize = 5 # publicaciones por página en el inicio

[params]
  # Imagen de cabecera (static/img/home-bg.jpg). Puedes reemplazarla por otra.
  header_image = 'img/home-bg.jpg'
  SEOTitle = 'Daniel Pérez García | Portafolio de datos'
  description = 'Portafolio de análisis de datos e ingeniería de analítica.'
  keyword = 'análisis de datos, analítica, SQL, Python, portafolio'
  slogan = 'Datos, analítica y pipelines'

  # Créditos del tema en el pie de página (incluye un botón de GitHub de un tercero).
  upstreamAttribution = false

  omit_categories = false   # las categorías aparecen como enlaces en el menú superior
  last_posts = true
  last_posts_title = 'ÚLTIMAS PUBLICACIONES'
  last_posts_count = 5

  featured_tags = true
  featured_condition_size = 1   # muestra etiquetas usadas en más de 1 publicación

  friends = false
  bookmarks = false
  about_me = true
  algolia_search = false        # la búsqueda usa Pagefind (se genera al publicar)

  # Barra lateral
  sidebar_about_description = 'Analista de datos e ingeniero de analítica.'
  sidebar_avatar = 'img/avatar.jpg'   # foto en static/img/

  # Modo oscuro: el botón está activo por defecto. Para quitarlo: dark_mode_toggle = false

  [[params.additional_menus]]
    title = 'ARCHIVO'
    href = '/archive'
  [[params.additional_menus]]
    title = 'ACERCA DE'
    href = '/acerca'

  [params.social]
    rss = true
    email = 'gr.dedaniel@gmail.com'
    github = 'https://github.com/ddjpgarcia'
    linkedin = 'https://www.linkedin.com/in/ddjpgarcia/'
    twitter = 'https://x.com/ddjpgarcia'   # el tema usa la clave "twitter" para X

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 2
  [markup.highlight]
    style = 'dracula'
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

[mediaTypes]
  [mediaTypes.'font/woff']
    suffixes = ['woff']
  [mediaTypes.'font/woff2']
    suffixes = ['woff2']
