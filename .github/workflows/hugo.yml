# Despliegue del sitio Hugo en GitHub Pages.
# Requiere: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Desplegar Hugo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # CleanWhite requiere Hugo 0.146 o posterior. Usa la misma versión que tengas en local (hugo version).
      HUGO_VERSION: 0.166.0
    steps:
      - name: Instalar Hugo Extended
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Checkout (incluye submódulos de temas)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Compilar
        env:
          HUGO_ENVIRONMENT: production
          TZ: America/Mexico_City
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Generar índice de búsqueda (Pagefind)
        run: npx -y pagefind@1.5.2 --site public --output-subdir _pagefind
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
